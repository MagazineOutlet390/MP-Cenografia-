<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A5FA5"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="500" rx="320" ry="24" fill="#CBD5E1" opacity="0.5"/>
  <!-- Grand Shopping Scenographic Archway -->
  <path d="M 160 500 L 160 260 C 160 140, 640 140, 640 260 L 640 500 L 580 500 L 580 270 C 580 180, 220 180, 220 270 L 220 500 Z" fill="url(#archGrad)"/>
  <!-- Decorative Suspended Ribs -->
  <circle cx="400" cy="240" r="70" fill="none" stroke="#60A5FA" stroke-width="6"/>
  <circle cx="400" cy="240" r="110" fill="none" stroke="#93C5FD" stroke-width="4" stroke-dasharray="8 8"/>
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">MP CENOGRAFIA · CENOGRAFIA DE GRANDE PORTE</text>
  </g>
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">[Fotografia provisória representativa · Cenografia em fibra de vidro para shopping center]</text>
  </g>
</svg>
