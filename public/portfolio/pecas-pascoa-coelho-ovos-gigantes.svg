<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="eggGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="eggGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="510" rx="300" ry="24" fill="#CBD5E1" opacity="0.5"/>
  <!-- Big Egg 1 -->
  <path d="M 330 490 C 230 490, 240 310, 310 240 C 370 170, 410 170, 440 240 C 500 310, 520 490, 420 490 Z" fill="url(#eggGrad1)"/>
  <!-- Big Egg 2 (Foreground) -->
  <path d="M 480 500 C 420 500, 420 370, 460 320 C 500 270, 530 270, 550 320 C 590 370, 610 500, 540 500 Z" fill="url(#eggGrad2)"/>
  <!-- Stylized Easter Rabbit silhouette -->
  <g transform="translate(190, 200)">
    <!-- Ears -->
    <ellipse cx="60" cy="50" rx="14" ry="70" fill="#2A5FA5" transform="rotate(-10 60 50)"/>
    <ellipse cx="100" cy="50" rx="14" ry="70" fill="#2A5FA5" transform="rotate(10 100 50)"/>
    <!-- Head -->
    <circle cx="80" cy="140" r="50" fill="#2A5FA5"/>
    <!-- Body -->
    <path d="M 40 290 C 20 230, 50 180, 80 180 C 110 180, 140 230, 120 290 Z" fill="#2A5FA5"/>
  </g>
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">MP CENOGRAFIA · PEÇAS SAZONAIS DE PÁSCOA</text>
  </g>
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">[Fotografia provisória representativa · Peças de Páscoa e ovos gigantes em fibra de vidro]</text>
  </g>
</svg>
