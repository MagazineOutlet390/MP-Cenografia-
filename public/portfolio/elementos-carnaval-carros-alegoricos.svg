<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="carnavalWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Floating dynamic carnival sculpture forms -->
  <path d="M 120 480 C 180 320, 310 180, 520 180 C 650 180, 680 340, 640 450 C 600 360, 540 260, 440 260 C 320 260, 220 380, 120 480 Z" fill="url(#carnavalWave)"/>
  <circle cx="280" cy="380" r="45" fill="#FBBF24" opacity="0.8"/>
  <circle cx="560" cy="220" r="60" fill="#EC4899" opacity="0.7"/>
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">MP CENOGRAFIA · ESCULTURAS DE CARNAVAL</text>
  </g>
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">[Fotografia provisória representativa · Peças esculpidas para Carnaval em fibra de vidro]</text>
  </g>
</svg>
