<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#ECEFF4"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2B48"/>
      <stop offset="50%" stop-color="#2A5FA5"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Architectural grid background lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <!-- Ground / Plinth shadow -->
  <ellipse cx="400" cy="480" rx="280" ry="26" fill="#CBD5E1" opacity="0.6"/>

  <!-- Stylized Fiberglass Bull Sculpture -->
  <!-- Left horn -->
  <path d="M 270 210 C 230 180, 190 190, 160 140 C 190 150, 240 180, 280 230 Z" fill="url(#goldHorn)"/>
  <!-- Right horn -->
  <path d="M 330 190 C 370 140, 420 120, 470 100 C 430 130, 390 170, 350 220 Z" fill="url(#goldHorn)"/>

  <!-- Bull Body Main Volume -->
  <path d="M 280 230 
           C 250 270, 230 330, 240 430 
           L 270 440 
           L 290 350 
           C 330 360, 410 360, 470 330 
           L 490 440 
           L 530 440 
           L 520 320 
           C 570 300, 610 280, 600 230 
           C 580 180, 490 190, 430 200 
           C 370 200, 310 200, 280 230 Z" 
        fill="url(#bullGrad)"/>

  <!-- Sculptural Facets & Muscle Definition -->
  <path d="M 280 230 L 330 290 L 370 240 L 430 250 L 460 300 L 520 280" fill="none" stroke="#60A5FA" stroke-width="2.5" opacity="0.8"/>
  <path d="M 290 350 L 340 310 L 400 330 L 470 310" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.6"/>

  <!-- Head Detail -->
  <polygon points="260,220 310,210 330,260 270,280" fill="#0B1220"/>
  <circle cx="285" cy="245" r="4" fill="#F8FAFC"/>

  <!-- Technical Spec Callout Graphic -->
  <g transform="translate(520, 110)">
    <rect width="210" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2A5FA5" letter-spacing="1">ESCULTURA ANATÔMICA</text>
    <text x="14" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0B1220">Touro / Boi em Fibra de Vidro</text>
    <text x="14" y="56" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Laminação PRFV · 2,60m x 1,75m</text>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">MP CENOGRAFIA · PROJETO DE ESCULTURA</text>
  </g>
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">[Fotografia provisória representativa · Escultura de boi em fibra de vidro]</text>
  </g>
</svg>
